# 🐳 Docker Compose para SnapEats API Documentation
# ================================================
#
# Este arquivo Docker Compose orquestra todos os serviços necessários
# para executar a documentação da API SnapEats com alta disponibilidade:
#
# Serviços incluídos:
# - snapeats-docs: Servidor principal de documentação
# - snapeats-monitor: Monitor de saúde e métricas
# - nginx-proxy: Proxy reverso e balanceador de carga
# - redis: Cache para sessões e dados temporários
#
# Uso:
#   docker-compose up -d
#   docker-compose logs -f
#   docker-compose down

version: "3.8"

# 🌐 Redes personalizadas
networks:
  snapeats-docs-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# 💾 Volumes persistentes
volumes:
  docs-logs:
    driver: local
  docs-data:
    driver: local
  redis-data:
    driver: local
  nginx-cache:
    driver: local

services:
  # 📚 Servidor Principal de Documentação
  snapeats-docs:
    build:
      context: .
      dockerfile: Dockerfile.docs
      args:
        - DOC_VERSION=1.0.0
        - ENVIRONMENT=production

    container_name: snapeats-docs-app
    hostname: docs-app

    environment:
      # Flask Configuration
      - FLASK_ENV=production
      - FLASK_DEBUG=false
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:-your-secret-key-here}

      # Gunicorn Configuration
      - GUNICORN_WORKERS=4
      - GUNICORN_WORKER_CLASS=sync
      - GUNICORN_TIMEOUT=30
      - GUNICORN_KEEPALIVE=5
      - GUNICORN_MAX_REQUESTS=1000

      # Documentation Configuration
      - DOC_VERSION=1.0.0
      - API_TITLE=SnapEats API
      - API_DESCRIPTION=Sistema de delivery de comida
      - CONTACT_EMAIL=suporte@snapeats.com
      - CONTACT_URL=https://snapeats.com/contato

      # Monitoring Configuration
      - ENABLE_MONITORING=true
      - MONITOR_INTERVAL=300
      - DOCS_ALERT_EMAIL=alerts@snapeats.com
      - DOCS_WEBHOOK_URL=${SLACK_WEBHOOK_URL}

      # Cache Configuration
      - REDIS_URL=redis://redis:6379/0

      # Security
      - TZ=America/Sao_Paulo

    volumes:
      - docs-logs:/app/logs
      - docs-data:/app/data
      - ./openapi.yaml:/app/openapi.yaml:ro
      - ./docs:/app/docs:ro

    ports:
      - "5000:5000" # Flask app (interno)

    networks:
      snapeats-docs-network:
        ipv4_address: 172.20.0.10

    depends_on:
      - redis

    restart: unless-stopped

    healthcheck:
      test: ["/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.docs-app.rule=Host(`docs.snapeats.com`)"
      - "traefik.http.services.docs-app.loadbalancer.server.port=5000"

  # 🌐 Nginx Proxy Reverso
  nginx-proxy:
    image: nginx:alpine
    container_name: snapeats-docs-nginx
    hostname: docs-nginx

    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/docs.conf:/etc/nginx/conf.d/default.conf:ro
      - docs-logs:/var/log/nginx
      - nginx-cache:/var/cache/nginx
      - ./static:/usr/share/nginx/html/docs:ro

    ports:
      - "80:80" # HTTP
      - "443:443" # HTTPS

    environment:
      - TZ=America/Sao_Paulo

    networks:
      snapeats-docs-network:
        ipv4_address: 172.20.0.20

    depends_on:
      - snapeats-docs

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.docs-nginx.rule=Host(`docs.snapeats.com`)"

  # 📊 Monitor de Documentação
  snapeats-monitor:
    build:
      context: .
      dockerfile: Dockerfile.docs
      target: builder

    container_name: snapeats-docs-monitor
    hostname: docs-monitor

    command: ["python3", "/app/scripts/monitor_docs.py"]

    environment:
      - DOCS_MONITOR_INTERVAL=300
      - DOCS_ALERT_EMAIL=alerts@snapeats.com
      - DOCS_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - TZ=America/Sao_Paulo

    volumes:
      - docs-logs:/app/logs
      - docs-data:/app/data
      - ./scripts:/app/scripts:ro

    networks:
      snapeats-docs-network:
        ipv4_address: 172.20.0.30

    depends_on:
      - snapeats-docs
      - redis

    restart: unless-stopped

    labels:
      - "monitoring.service=docs-health"

  # 🗄️ Redis Cache
  redis:
    image: redis:7-alpine
    container_name: snapeats-docs-redis
    hostname: docs-redis

    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--appendfsync",
        "everysec",
        "--maxmemory",
        "256mb",
        "--maxmemory-policy",
        "allkeys-lru",
        "--tcp-keepalive",
        "60",
        "--timeout",
        "300",
      ]

    volumes:
      - redis-data:/data

    ports:
      - "6379:6379" # Redis (opcional, para debug)

    environment:
      - TZ=America/Sao_Paulo

    networks:
      snapeats-docs-network:
        ipv4_address: 172.20.0.40

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

    labels:
      - "backup.enable=true"
      - "backup.schedule=daily"

  # 📈 Métricas e Monitoramento (Opcional)
  prometheus:
    image: prom/prometheus:latest
    container_name: snapeats-docs-prometheus
    hostname: docs-prometheus

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--storage.tsdb.retention.time=200h"
      - "--web.enable-lifecycle"

    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - docs-data:/prometheus

    ports:
      - "9090:9090" # Prometheus UI

    networks:
      snapeats-docs-network:
        ipv4_address: 172.20.0.50

    restart: unless-stopped

    profiles:
      - monitoring

    labels:
      - "monitoring.service=metrics"

  # 📊 Grafana Dashboard (Opcional)
  grafana:
    image: grafana/grafana:latest
    container_name: snapeats-docs-grafana
    hostname: docs-grafana

    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin123}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel

    volumes:
      - docs-data:/var/lib/grafana
      - ./monitoring/grafana:/etc/grafana/provisioning:ro

    ports:
      - "3000:3000" # Grafana UI

    networks:
      snapeats-docs-network:
        ipv4_address: 172.20.0.60

    depends_on:
      - prometheus

    restart: unless-stopped

    profiles:
      - monitoring

    labels:
      - "monitoring.service=dashboard"

# 🔧 Configurações adicionais
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "5"

# Aplicar logging padrão a todos os serviços
x-default-logging:
  - &apply-logging
    logging: *default-logging
