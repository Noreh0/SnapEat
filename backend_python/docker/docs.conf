# 📚 Configuração Virtual Host para Documentação SnapEats
# ======================================================

server {
    listen 80;
    listen [::]:80;
    server_name docs.snapeats.com docs-stage.snapeats.com localhost;
    
    # Redirect HTTP to HTTPS in production
    if ($host != "localhost") {
        return 301 https://$server_name$request_uri;
    }
    
    # Root para arquivos estáticos
    root /usr/share/nginx/html;
    index index.html;
    
    # Configurações de charset
    charset utf-8;
    
    # 📖 Documentação Principal (Swagger UI)
    location /docs/ {
        limit_req zone=docs burst=20 nodelay;
        
        try_files $uri $uri/ @flask_docs;
        
        # Headers específicos para documentação
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Docs-Version "1.0.0" always;
        
        # CORS para desenvolvimento
        if ($http_origin ~* ^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$) {
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Accept, Authorization, Content-Type" always;
        }
    }
    
    # 🔗 API Endpoints (proxy para Flask)
    location /api/ {
        limit_req zone=api burst=10 nodelay;
        
        proxy_pass http://flask_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        
        # Headers para API
        add_header X-API-Version "1.0.0" always;
        add_header X-Response-Time $upstream_response_time always;
    }
    
    # 📊 OpenAPI Specification
    location /openapi.json {
        limit_req zone=docs burst=15 nodelay;
        
        proxy_pass http://flask_app;
        proxy_set_header Host $host;
        
        # Cache para spec OpenAPI
        add_header Cache-Control "public, max-age=300" always;
        add_header Content-Type "application/json" always;
    }
    
    # 🏥 Health Check
    location /health {
        access_log off;
        
        proxy_pass http://flask_app/api/health;
        proxy_set_header Host $host;
        
        # Headers para health check
        add_header Cache-Control "no-cache, no-store" always;
    }
    
    # 📈 Status Dashboard
    location /status {
        alias /usr/share/nginx/html/status_dashboard.html;
        
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Refresh "60" always;
    }
    
    # 🎨 Assets estáticos (CSS, JS, Imagens)
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary "Accept-Encoding";
        
        # Compressão adicional para assets
        gzip_static on;
    }
    
    # 🔒 Segurança - Bloquear arquivos sensíveis
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    location ~ \.(sql|log|conf|env)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # 🤖 robots.txt
    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /api/\nAllow: /docs/\nSitemap: https://$server_name/sitemap.xml\n";
    }
    
    # 📋 Fallback para Flask app
    location @flask_docs {
        proxy_pass http://flask_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # 📄 Página de erro personalizada
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    
    location = /404.html {
        internal;
        return 200 '<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>404 - Página Não Encontrada | SnapEats Docs</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 50px; }
        .error { color: #d97746; font-size: 24px; }
        .message { margin: 20px 0; }
        .link { color: #007bff; text-decoration: none; }
    </style>
</head>
<body>
    <div class="error">🍽️ SnapEats API Docs</div>
    <h1>404 - Página Não Encontrada</h1>
    <div class="message">A documentação que você procura não existe.</div>
    <a href="/docs/" class="link">← Voltar para a Documentação</a>
</body>
</html>';
        add_header Content-Type text/html;
    }
    
    location = /50x.html {
        internal;
        return 200 '<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Erro do Servidor | SnapEats Docs</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 50px; }
        .error { color: #dc3545; font-size: 24px; }
        .message { margin: 20px 0; }
    </style>
</head>
<body>
    <div class="error">🚨 SnapEats API Docs</div>
    <h1>Erro Temporário do Servidor</h1>
    <div class="message">Estamos trabalhando para resolver o problema.</div>
    <div class="message">Tente novamente em alguns minutos.</div>
</body>
</html>';
        add_header Content-Type text/html;
    }
}

# 🔒 Configuração HTTPS (para produção)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name docs.snapeats.com docs-stage.snapeats.com;
    
    # Certificados SSL (configurar com Let's Encrypt ou similar)
    # ssl_certificate /etc/ssl/certs/snapeats.crt;
    # ssl_certificate_key /etc/ssl/private/snapeats.key;
    
    # Configurações SSL modernas
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    
    # Reutilizar configuração HTTP
    include /etc/nginx/conf.d/default.conf.include;
}