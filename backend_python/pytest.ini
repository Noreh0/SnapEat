[pytest]
# Diretórios de teste
testpaths = tests

# Padrão de arquivos de teste
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Opções de output
addopts = 
    -v
    --tb=short
    --strict-markers
    --cov=.
    --cov-report=html
    --cov-report=term-missing
    --cov-report=xml
    --cov-config=.coveragerc
    --cov-fail-under=75

# Markers personalizados
markers =
    unit: marca testes unitários
    integration: marca testes de integração
    slow: marca testes lentos
    database: marca testes que precisam do banco de dados
    firebase: marca testes que usam Firebase
    email: marca testes que enviam emails

# Configurações de warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Timeout para testes (em segundos)
timeout = 300

# Configurações de cobertura
[coverage:run]
source = .
omit = 
    */tests/*
    */venv/*
    */env/*
    */__pycache__/*
    */site-packages/*
    conftest.py
    setup.py

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov