<section class="criar-avaliacao-page">
  <div class="eval-card">
    <!-- CABEÇALHO -->
    <header class="eval-header">
      <h1>
        {{ avalId ? 'Editar Avaliação' : 'Nova Avaliação' }}
      </h1>
    </header>
    <div *ngIf="prato" class="prato-info">
      <img [src]="prato.imagem_url ? 'http://localhost:5000' + prato.imagem_url : 'assets/images/default-prato.png'" class="prato-mini-img" alt="Imagem do prato" />
      <div class="prato-details">
        <div class="prato-nome">{{ prato.Nome }}</div>
        <!-- Se quiser mostrar nota média, adicione aqui -->
      </div>
    </div>

    <form [formGroup]="formulario" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Nota</label>
        <select formControlName="Nota" class="form-select">
          <option value="" disabled>Selecione</option>
          <option *ngFor="let n of [1,2,3,4,5]" [value]="n">
            {{ n }} estrela{{ n>1?'s':'' }}
          </option>
        </select>
        <div *ngIf="f['Nota'].invalid && f['Nota'].touched" class="error">
          Nota obrigatória.
        </div>
      </div>

      <div class="form-group">
        <label>Comentário</label>
        <textarea
          formControlName="Comentario"
          rows="4"
          class="form-textarea"
        ></textarea>
        <div *ngIf="f['Comentario'].invalid && f['Comentario'].touched" class="error">
          Comentário mínimo de 10 caracteres.
        </div>
      </div>

      <div class="form-actions">
        <button class="btn-primary" [disabled]="formulario.invalid">
          Salvar
        </button>
        <button class="btn-secondary" type="button" (click)="cancel()">
          Cancelar
        </button>
      </div>
    </form>
  </div>
</section>
