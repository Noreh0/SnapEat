<!-- cabecalho.component.html -->
<header class="cabecalho">
  <!-- lado esquerdo: ícone do usuário (ou logo) -->
  <div class="cabecalho__logo">
    <button class="cabecalho__btn-logo" (click)="goHome()">
      <img
        class="cabecalho__avatar"
        src="../../../assets/images/logo_snapEats.png"
        alt="Avatar do usuário"
      />
    </button>
  </div>

  <!-- parte central: título ou slogan (opcional) -->
  <div class="cabecalho__titulo" routerLink="/">
    <h1>SnapEats</h1>
  </div>

  <!-- navegação / botões principais -->
  <nav class="cabecalho__nav">
    <!-- se estiver logado -->
    <ng-container *ngIf="logado; else blocoNaoLogado">
      <span class="cabecalho__saudacao">
        Olá,
        <strong *ngIf="nomeUsuario">{{ nomeUsuario }}</strong>!
      </span>

      <ul class="cabecalho__lista-links">
        <!-- links comuns a todos -->
        <li><a routerLink="/menu" class="cabecalho__link">Menu</a></li>

        <!-- botão “Perfil Cliente” ou “Perfil Restaurante” -->
        <li *ngIf="tipo === 'cliente'; else perfilRestaurante">
          <a [routerLink]="['/perfilCliente', id]" class="cabecalho__link">
            Perfil
          </a>
        </li>
        <ng-template #perfilRestaurante>
          <li>
            <a
              [routerLink]="['/perfilRestaurante', id]"
              class="cabecalho__link"
            >
              Perfil
            </a>
          </li>
          <li *ngIf="tipo==='restaurante'">
            <a [routerLink]="['/restaurante', id, 'pratos']" class="cabecalho__link">
              Pratos
            </a>
          </li>
        </ng-template>

        <!-- botão trocar idioma -->
        <li>
          <button class="cabecalho__link cabecalho__link--button" (click)="changeLanguage()">
            {{ currentLanguage === 'pt' ? 'EN' : 'PT' }}
          </button>
        </li>

        <!-- logout -->
        <li>
          <button class="cabecalho__link cabecalho__link--button" (click)="logout()">
            Logout
          </button>
        </li>
      </ul>
    </ng-container>

    <!-- se NÃO estiver logado -->
    <ng-template #blocoNaoLogado>
      <ul class="cabecalho__lista-links">
        <li><a routerLink="/cadastroCliente" class="cabecalho__link">Cadastro Cliente</a></li>
        <li><a routerLink="/cadastroRestaurante" class="cabecalho__link">Cadastro Restaurante</a></li>
        <li><a routerLink="/login" class="cabecalho__link">Login</a></li>
        <li>
          <button class="cabecalho__link cabecalho__link--button" (click)="changeLanguage()">
            {{ currentLanguage === 'pt' ? 'EN' : 'PT' }}
          </button>
        </li>
      </ul>
    </ng-template>
  </nav>
</header>
