<section class="dashboard-restaurante-page" *ngIf="restaurante">
  <!-- HEADER COM INFORMAÇÕES GERAIS -->
  <div class="dash-header-card">
    <div class="rest-info">
      <img
        src="../../../assets/images/default-restaurant.png"
        alt="{{ restaurante.Nome }}"
        class="rest-avatar"
      />
      <div class="rest-meta">
        <h1>Bem-vindo, {{ restaurante.Nome }}</h1>
        <p>
          Avaliação média:
          <strong>{{ mediaAval | number:'1.1-1' }}</strong>
          ({{ totalAval }} avaliações)
        </p>
      </div>
    </div>
  </div>

  <!-- SEÇÃO DE ÚLTIMAS AVALIAÇÕES -->
  <section class="recent-section">
    <h2>Últimas Avaliações</h2>

    <!-- quando não há avaliações -->
    <div *ngIf="avaliacoes.length === 0" class="no-evals">
      Você ainda não recebeu avaliações.
    </div>

    <!-- lista de cards de avaliação -->
    <div class="eval-list">
      <div
        *ngFor="let a of avaliacoes"
        class="eval-card"
      >
        <div class="eval-header">
          <span class="cliente">{{ a.clienteNome }}</span>
          <span class="stars">{{ renderStars(a.Nota) }}</span>
          <span class="date">{{ a.data | date:'dd/MM/yyyy' }}</span>
        </div>
        <p class="comentario">{{ a.Comentario }}</p>
        <button
          *ngIf="isOwner"
          class="btn-reply"
          (click)="responder(a)"
        >
          Responder
        </button>
      </div>
    </div>
  </section>
</section>
