<div class="form-card" *ngIf="formulario && restaurante">
  <header class="form-header">
    <h1>Editar Perfil do Restaurante</h1>
  </header>

  <form [formGroup]="formulario" (ngSubmit)="editarRestaurante()" novalidate>
    <div class="form-grid">
      <!-- Seção da Imagem -->
      <aside class="avatar-section">
        <img
          [src]="previewImg || defaultAvatar"
          alt="Preview da foto do restaurante"
          class="avatar-preview"
          (error)="handleImageError($event)"
        />
        <label for="imagem" class="file-input-label">Trocar Imagem</label>
        <input type="file" id="imagem" (change)="onFileSelected($event)" accept="image/*" />
      </aside>

      <!-- Seção dos Campos do Formulário -->
      <main class="form-fields">
        <div class="form-row">
          <div class="form-group">
            <label for="Nome">Razão Social</label>
            <input id="Nome" type="text" formControlName="Nome" class="form-control">
            <div class="error" *ngIf="formulario.get('Nome')?.invalid && formulario.get('Nome')?.touched">
              Razão Social é obrigatória.
            </div>
          </div>
          <div class="form-group">
            <label for="nome_fantasia">Nome Fantasia</label>
            <input id="nome_fantasia" type="text" formControlName="nome_fantasia" class="form-control">
            <div class="error" *ngIf="formulario.get('nome_fantasia')?.invalid && formulario.get('nome_fantasia')?.touched">
              Nome Fantasia é obrigatório.
            </div>
          </div>
        </div>

        <div class="form-group">
          <label for="descricao">Descrição</label>
          <textarea id="descricao" formControlName="descricao" class="form-control" rows="3"></textarea>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="CNPJ">CNPJ</label>
            <input id="CNPJ" type="text" formControlName="CNPJ" class="form-control" readonly>
          </div>
          <div class="form-group">
            <label for="email">Email de Contato</label>
            <input id="email" type="email" formControlName="email" class="form-control" readonly>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="tipo_restaurante">Tipo de Cozinha</label>
            <select id="tipo_restaurante" formControlName="tipo_restaurante" class="form-control">
              <option *ngFor="let t of tipos" [value]="t">{{ t }}</option>
            </select>
          </div>
          <div class="form-group">
            <label for="telefone">Telefone</label>
            <input id="telefone" type="text" formControlName="telefone" class="form-control" mask="(00) 0000-0000">
          </div>
        </div>

        <div class="form-group">
          <label for="Endereco">Endereço</label>
          <input id="Endereco" type="text" formControlName="Endereco" class="form-control">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="bairro">Bairro</label>
            <input id="bairro" type="text" formControlName="bairro" class="form-control">
          </div>
          <div class="form-group">
            <label for="Cidade">Cidade</label>
            <input id="Cidade" type="text" formControlName="Cidade" class="form-control">
          </div>
        </div>

        <hr style="border: none; border-top: 1px solid #EAE3DB; margin: 15px 0;">

        <div class="form-row">
          <div class="form-group">
            <label for="senha">Nova Senha (opcional)</label>
            <div class="senha-wrapper">
              <input [type]="hideSenha ? 'password' : 'text'" id="senha" class="form-control" formControlName="senha">
              <button type="button" class="icon-btn" (click)="hideSenha = !hideSenha">
                <img src="assets/images/olho_senha.png" alt="Mostrar senha" style="width: 20px;">
              </button>
            </div>
            <div class="error" *ngIf="formulario.get('senha')?.hasError('pattern')">
              Senha fraca (precisa de maiúscula, minúscula, número e símbolo).
            </div>
          </div>
          <div class="form-group">
            <label for="confirmasenha">Confirmar Nova Senha</label>
            <input type="password" id="confirmasenha" class="form-control" formControlName="confirmasenha">
            <div class="error" *ngIf="formulario.hasError('mismatch') && formulario.get('confirmasenha')?.touched">
              As senhas não coincidem.
            </div>
          </div>
        </div>
      </main>
    </div>

    <div class="form-actions">
      <button type="button" class="btn btn-secondary" (click)="onCancelar()">Cancelar</button>
      <button type="submit" class="btn btn-primary" [disabled]="formulario.invalid">Salvar Alterações</button>
    </div>
  </form>
</div>
