<section class="login-container">
  <div class="login-card">
    <h1 class="login-card__title">Login</h1>

    <form [formGroup]="loginForm" (ngSubmit)="login()">
      <!-- Campo de Email -->
      <div class="login-card__field">
        <label for="email">E-mail</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="Digite seu e-mail"
          class="login-card__input"
        />
        <div
          class="login-card__error"
          *ngIf="
            loginForm.get('email')?.hasError('required') &&
            loginForm.get('email')?.touched
          "
        >
          Campo obrigatório
        </div>
        <div
          class="login-card__error"
          *ngIf="loginForm.get('email')?.hasError('email')"
        >
          Formato de e-mail inválido
        </div>
      </div>

      <!-- Campo de Senha -->
      <div class="login-card__field">
        <label for="senha">Senha</label>
        <input
          id="senha"
          type="password"
          formControlName="senha"
          placeholder="Digite sua senha"
          class="login-card__input"
        />
        <div
          class="login-card__error"
          *ngIf="
            loginForm.get('senha')?.hasError('required') &&
            loginForm.get('senha')?.touched
          "
        >
          Campo obrigatório
        </div>
      </div>

      <!-- Botão “Entrar” -->
      <button
        type="submit"
        class="login-card__btn-primary"
        [disabled]="loginForm.invalid || carregando"
      >
        {{ carregando ? 'Carregando…' : 'Entrar' }}
      </button>

      <!-- Botão “Entrar com Google” (mock) -->
      <button
        type="button"
        class="login-card__btn-google"
        (click)="loginComGoogle()"
      >
        <img
          src="assets/images/google-logo.png"
          alt="Google Logo"
          class="login-card__btn-google-icon"
        />
        Entrar com Google
      </button>

      <!-- Exibe mensagem de erro do backend -->
      <div class="login-card__error login-card__error-server" *ngIf="mensagemErro">
        {{ mensagemErro }}
      </div>
    </form>

    <div class="login-card__links">
      <a routerLink="/cadastroCliente">Cadastre-se como Cliente</a>
      <span>|</span>
      <a routerLink="/cadastroRestaurante">Cadastre-se como Restaurante</a>
      <span>|</span>
      <a (click)="abrirRecuperarSenha()" style="cursor:pointer;">Esqueci minha senha</a>
    </div>
  </div>
</section>
