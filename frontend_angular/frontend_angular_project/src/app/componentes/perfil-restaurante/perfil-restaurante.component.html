<h2>{{ Nome }}</h2>
<p>Email: {{ Email }}</p>
<p>Nota média: {{ Nota }}</p>

<button routerLink="/menu">Voltar</button>

<button
  *ngIf="id>0"
  [routerLink]="['/perfilRestaurante', id, 'editarRestaurante']">
  Editar Restaurante
</button>

<button (click)="excluirRestaurante()">Excluir Restaurante</button>


<h3>Avaliações</h3>
<ul>
  <li *ngFor="let a of listaAvaliacao">
    {{ a.Comentario }} — Nota: {{ a.Nota }}
  </li>
</ul>
