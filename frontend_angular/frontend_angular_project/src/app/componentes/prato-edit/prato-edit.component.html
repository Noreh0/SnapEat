<section class="prato-form-page">
  <div class="form-card">
    <header class="form-header">
      <h1>Editar Prato</h1>
    </header>
    <form [formGroup]="formulario" (ngSubmit)="onSubmit()" novalidate>
      <div class="form-group">
        <label>Nome</label>
        <input type="text" formControlName="nome" class="form-input" />
        <div class="error" *ngIf="f['nome'].invalid && f['nome'].touched">
          Nome é obrigatório.
        </div>
      </div>
      <div class="form-group">
        <label>Descrição</label>
        <textarea formControlName="descricao" class="form-textarea"></textarea>
      </div>
      <div class="form-group">
        <label>Preço</label>
        <input
          type="number"
          formControlName="preco"
          class="form-input"
          step="0.01"
        />
        <div class="error" *ngIf="f['preco'].invalid && f['preco'].touched">
          Preço obrigatório.
        </div>
      </div>
      <div class="form-group">
        <label>Imagem (opcional)</label>
        <input type="file" (change)="onFileSelected($event)" />
        <img *ngIf="previewImg" [src]="previewImg" class="preview-img" />
      </div>
      <div class="form-actions">
        <button class="btn-primary" [disabled]="formulario.invalid">
          Salvar
        </button>
        <button class="btn-secondary" type="button" (click)="cancel()">
          Cancelar
        </button>
      </div>
    </form>
  </div>
</section>
