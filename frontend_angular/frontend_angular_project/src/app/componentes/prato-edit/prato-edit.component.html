<div class="form-card">
  <header class="form-card-header">
    <h1>Editar Prato</h1>
  </header>

  <form [formGroup]="formulario" (ngSubmit)="onSubmit()" novalidate>
    <div class="form-grid">
      <!-- Seção de Imagem -->
      <div class="image-section">
        <div class="preview-container">
          <ng-container *ngIf="previewImg; else placeholderTemplate">
            <img [src]="previewImg" class="preview-img" alt="Prévia do prato" />
          </ng-container>
          <ng-template #placeholderTemplate>
            <div class="placeholder-text">
              Nenhuma imagem selecionada. Escolha uma foto para ilustrar o prato.
            </div>
          </ng-template>
        </div>

        <label for="imagem" class="upload-btn">
          <svg viewBox="0 0 24 24">
            <path d="M4 5h13v7h2V5c0-1.103-.897-2-2-2H4c-1.103 0-2 .897-2 2v12c0 1.103.897 2 2 2h8v-2H4V5z"></path>
            <path d="m8 11-3 4h11l-4-6-3 4z"></path>
            <path d="M19 14h-2v3h-3v2h3v3h2v-3h3v-2h-3z"></path>
          </svg>
          Escolher imagem
          <input type="file" id="imagem" (change)="onFileSelected($event)" accept="image/*" />
        </label>

        <div class="file-name" *ngIf="selectedFile">
          {{ selectedFile.name }}
        </div>
      </div>

      <!-- Campos do Formulário -->
      <div class="form-fields">
        <div class="form-grid-2">
          <!-- Nome do prato -->
          <div class="form-group">
            <label for="nome">Nome do prato <span>*</span></label>
            <input
              id="nome"
              type="text"
              formControlName="nome"
              placeholder="Digite o nome do prato"
              class="form-control"
            />
            <small class="error" *ngIf="f['nome'].invalid && f['nome'].touched">
              Nome é obrigatório.
            </small>
          </div>

          <!-- Preço -->
          <div class="form-group">
            <label for="preco">Preço <span>*</span></label>
            <input
              id="preco"
              type="number"
              formControlName="preco"
              placeholder="Ex: 25.50"
              step="0.01"
              min="0"
              class="form-control"
            />
            <small class="error" *ngIf="f['preco'].invalid && f['preco'].touched">
              Preço é obrigatório.
            </small>
          </div>
        </div>

        <!-- Descrição -->
        <div class="form-group">
          <label for="descricao">Descrição</label>
          <textarea
            id="descricao"
            formControlName="descricao"
            rows="6"
            placeholder="Descreva os ingredientes e características do prato"
            class="form-control textarea"
          ></textarea>
        </div>
      </div>
    </div>

    <!-- Botões de Ação -->
    <div class="form-actions">
      <button
        type="button"
        class="btn-secondary"
        (click)="cancel()"
      >
        Cancelar
      </button>
      <button
        type="submit"
        class="btn-primary"
        [disabled]="formulario.invalid"
      >
        Salvar Alterações
      </button>
    </div>
  </form>
</div>
